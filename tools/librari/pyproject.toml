[project]
name = "librari"
version = "0.1.0"
description = "Contract validator, section-level edit API and formatter for the agent-facing knowledge base (kb/)."
requires-python = ">=3.12"
dependencies = [
    "markdown-it-py>=3.0",
    "mcp>=2",
    "mdit-py-plugins>=0.4",
    "pygments>=2.17",
    "pyyaml>=6.0",
]

[project.scripts]
librari = "librari.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/librari"]
include = ["src/librari/assets/*", "src/librari/templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
